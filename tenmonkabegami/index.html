<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天文研究部｜こたえ入力</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Montserrat:wght@600;800&display=swap');

        :root {
            --glass-bg: rgba(20, 25, 40, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-gold: #fbbf24;
            --accent-glow: rgba(251, 191, 36, 0.4);
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            background-attachment: fixed;
            color: #f3f4f6;
            min-height: 100dvh;
            position: relative;
            letter-spacing: 0.05em;
        }

        .bg-image-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('galaxy.jpg'); 
            background-size: cover;
            background-position: center;
            opacity: 0.6;
            z-index: -1;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .font-en {
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.1em;
        }

        .title-gradient {
            background: linear-gradient(to right, #fff 20%, #fbbf24 50%, #fff 80%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 5s linear infinite;
            font-weight: 900; 
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }

        .input-group {
            position: relative;
            transition: all 0.3s ease;
        }
        .clean-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s ease;
            font-family: 'Zen Maru Gothic', sans-serif;
        }
        .clean-input:focus {
            background: rgba(0, 0, 0, 0.6);
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px var(--accent-glow);
            outline: none;
        }

        .btn-cosmic {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-cosmic::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .btn-cosmic:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(245, 158, 11, 0.5);
        }
        .btn-cosmic:hover::after {
            left: 100%;
        }
        .btn-cosmic:active {
            transform: translateY(1px);
        }

        .preview-frame {
            border: 4px solid #374151;
            border-radius: 1.5rem;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            aspect-ratio: 9/16;
            max-width: 220px;
            margin: 0 auto;
            background: #111827;
        }

        .fade-enter {
            animation: fadeEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeEnter {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="bg-image-overlay"></div>

    <div class="w-full max-w-md glass-card rounded-2xl overflow-hidden fade-enter relative z-10">
        
        <div class="pt-10 pb-6 px-8 text-center">
            <div class="inline-block p-3 rounded-full bg-white/5 mb-4 border border-white/10 shadow-[0_0_20px_rgba(251,191,36,0.15)]">
                <i class="fa-solid fa-star text-2xl text-yellow-400"></i>
            </div>
            <h1 class="text-2xl tracking-wider mb-2">
                <span class="title-gradient">クロスワード回答</span>
            </h1>
            <p class="text-gray-400 text-xs font-medium tracking-widest uppercase font-en">
                Tenmon Kenkyu-bu
            </p>
        </div>

        <div id="input-area" class="px-8 pb-10">
            <p class="text-gray-300 text-sm text-center mb-8 leading-relaxed font-bold">
                クロスワードの<br>「答え」を入力してください。
            </p>

            <div class="space-y-5">
                <div class="input-group">
                    <label for="keyword" class="block text-xs font-bold text-yellow-500/80 mb-1.5 font-en tracking-wide ml-1">ANSWER</label>
                    <div class="relative">
                        <i class="fa-solid fa-pen absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
                        <input type="text" id="keyword" placeholder="答えを入力..." 
                            class="clean-input w-full rounded-xl py-3.5 pl-12 pr-4 text-base placeholder-gray-500 focus:placeholder-gray-400 font-bold">
                    </div>
                </div>
                
                <button onclick="checkKeyword()" 
                    class="btn-cosmic w-full py-4 rounded-xl text-white font-bold tracking-widest text-sm shadow-lg flex items-center justify-center gap-2 font-en">
                    <span>UNLOCK</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
            
            <div id="error-msg" class="hidden mt-6 p-3 bg-red-500/10 border border-red-500/20 rounded-lg flex items-center gap-3 text-red-200 text-sm animate-pulse">
                <i class="fa-solid fa-circle-xmark text-red-400"></i>
                <span>答えが間違っています</span>
            </div>
        </div>

        <div id="result-area" class="hidden px-6 pb-10 pt-2">
            <div class="text-center">
                <div class="mb-6">
                    <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-green-500/20 text-green-300 text-xs font-bold border border-green-500/30">
                        <i class="fa-solid fa-check"></i> 正解！
                    </span>
                </div>

                <div class="relative mb-8">
                    <div id="wallpaper-preview-container" class="preview-frame bg-cover bg-center"></div>
                    <div class="absolute top-2 left-1/2 transform -translate-x-1/2 w-16 h-4 bg-black rounded-b-xl z-10 opacity-80"></div>
                </div>

                <p id="desc-text" class="text-gray-300 text-sm mb-8 px-2 leading-loose border-l-2 border-yellow-500/50 pl-4 text-left bg-white/5 py-2 rounded-r-lg">
                </p>

                <div class="grid grid-cols-2 gap-3">
                    <a id="download-pc" href="#" download class="flex flex-col items-center justify-center bg-slate-800/80 hover:bg-slate-700 text-white rounded-xl p-4 border border-slate-600 hover:border-slate-500 transition group">
                        <i class="fa-solid fa-desktop text-xl mb-2 text-blue-400 group-hover:scale-110 transition"></i>
                        <span class="text-[10px] text-gray-400 font-en tracking-wide">FOR PC</span>
                        <span class="font-bold text-xs">ダウンロード</span>
                    </a>
                    
                    <a id="download-mobile" href="#" download class="flex flex-col items-center justify-center bg-slate-800/80 hover:bg-slate-700 text-white rounded-xl p-4 border border-slate-600 hover:border-slate-500 transition group">
                        <i class="fa-solid fa-mobile-screen text-xl mb-2 text-pink-400 group-hover:scale-110 transition"></i>
                        <span class="text-[10px] text-gray-400 font-en tracking-wide">FOR MOBILE</span>
                        <span class="font-bold text-xs">ダウンロード</span>
                    </a>
                </div>

                <button onclick="resetForm()" class="mt-8 text-gray-500 text-sm hover:text-white transition flex items-center justify-center mx-auto gap-2 py-2 px-4 rounded-lg hover:bg-white/5">
                    <i class="fa-solid fa-arrow-rotate-left"></i>
                    <span>戻る</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ▼▼▼ 設定エリア ▼▼▼
        const secretData = {
            "金星": {
                file_pc: "irast.jpg",
                file_mobile: "irast.jpg",
                desc: "今年度のビラに使用されているデザインです。部員が作成しました。実はもう一種類正解があります。並び替えてみてね",
                aliases: ["きんせい", "いんせき","隕石"] 
            },
            "合言葉": {
                file_pc: "moon.jpg",
                file_mobile: "moon.jpg",
                desc: "絶対そういうことすると思ったよ。しょうがねぇなこれやるよ",
                aliases: ["あいことば","合言葉を入力","こたえ","答え"]
            },
            "隕石": {
                file_pc: "star.jpg",
                file_mobile: "star.jpg",
                desc: "クロスワード完成おめでとう！実はもう一種類正解があります。並び替えてみてね",
                aliases: ["きんせい"] 
            }
        };
        // ▲▲▲ 設定エリア終了 ▲▲▲

        const inputArea = document.getElementById('input-area');
        const resultArea = document.getElementById('result-area');
        const keywordInput = document.getElementById('keyword');
        const errorMsg = document.getElementById('error-msg');
        
        const descText = document.getElementById('desc-text');
        const previewContainer = document.getElementById('wallpaper-preview-container');
        
        const btnPc = document.getElementById('download-pc');
        const btnMobile = document.getElementById('download-mobile');

        function checkKeyword() {
            const inputVal = keywordInput.value.trim().toLowerCase();
            let foundData = null;

            if (secretData[inputVal]) {
                foundData = secretData[inputVal];
            } else {
                for (const key in secretData) {
                    if (secretData[key].aliases && secretData[key].aliases.includes(inputVal)) {
                        foundData = secretData[key];
                        break;
                    }
                }
            }

            if (foundData) {
                errorMsg.classList.add('hidden');
                keywordInput.classList.remove('border-red-500', 'ring-red-500');

                // プレビューと説明の更新
                previewContainer.style.backgroundImage = `url('${foundData.file_mobile}')`;
                descText.textContent = foundData.desc;
                
                // ▼▼▼ ダウンロードボタンの動作書き換え（ここが重要） ▼▼▼
                
                // PCボタンの設定
                btnPc.onclick = (e) => {
                    e.preventDefault(); 
                    forceDownload(foundData.file_pc, foundData.file_pc.split('/').pop());
                };
                btnPc.href = "#"; 

                // スマホボタンの設定
                btnMobile.onclick = (e) => {
                    e.preventDefault();
                    forceDownload(foundData.file_mobile, foundData.file_mobile.split('/').pop());
                };
                btnMobile.href = "#";

                // ▲▲▲ 書き換え終了 ▲▲▲

                inputArea.style.opacity = '0';
                setTimeout(() => {
                    inputArea.classList.add('hidden');
                    resultArea.classList.remove('hidden');
                    
                    resultArea.animate([
                        { opacity: 0, transform: 'translateY(10px)' },
                        { opacity: 1, transform: 'translateY(0)' }
                    ], { duration: 400, fill: 'forwards', easing: 'ease-out' });
                }, 300);

            } else {
                errorMsg.classList.remove('hidden');
                keywordInput.classList.add('animate-pulse', 'border-red-500');
                setTimeout(() => keywordInput.classList.remove('animate-pulse'), 500);
            }
        }

        function resetForm() {
            keywordInput.value = '';
            errorMsg.classList.add('hidden');
            keywordInput.classList.remove('border-red-500');

            resultArea.style.opacity = '0';
            setTimeout(() => {
                resultArea.classList.add('hidden');
                inputArea.classList.remove('hidden');
                inputArea.style.opacity = '1';
                previewContainer.style.backgroundImage = '';
            }, 300);
        }

        // 強制ダウンロード関数
        async function forceDownload(url, filename) {
            try {
                // 1. 画像データを取得
                const response = await fetch(url);
                
                // ステータスチェック（ファイルがない場合のエラーハンドリング）
                if (!response.ok) throw new Error('Network response was not ok');

                const blob = await response.blob();

                // 2. 一時的なダウンロード用URLを作成
                const blobUrl = window.URL.createObjectURL(blob);

                // 3. 一時的なリンクを作成してクリック
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();

                // 4. 後片付け
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (e) {
                // 失敗した場合（別ドメインやローカルファイル制限など）
                console.error('Download failed:', e);
                // 仕方ないので通常の別タブ表示にフォールバック
                window.open(url, '_blank');
            }
        }

        // イベントリスナーの設定
        keywordInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkKeyword();
        });
        
        keywordInput.addEventListener('focus', function() {
            errorMsg.classList.add('hidden');
            this.classList.remove('border-red-500');
        });
    </script>
</body>
</html>
