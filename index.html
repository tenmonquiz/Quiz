                { question: "三大流星群とはしぶんぎ座流星群、ペルセウス流星群となんでしょう？", choices: ["オリオン流星群", "おうし座流星群", "しし座流星群", "ふたご座流星群"], answer: "ふたご座流星群", exp:"1月のしぶんぎ座流星群、8月のペルセウス座流星群、12月のふたご座流星群は毎年安定して多くの流星が流れることから三大流星群と呼ばれます。" },

                { question: "天の北極があるのはこぐま座ですが、天の南極があるのは何座でしょう？", choices: ["しぶんぎ座", "ろくぶんぎ座", "はちぶんぎ座", "じゅうぶんぎ座"], answer: "はちぶんぎ座", exp:"ろくぶんぎ座は存在しますがじゅうぶんぎ座は実在しません。しぶんぎ座は過去に存在した星座で、現在はしぶんぎ座流星群にその名を残しています。" }

        // --- 2. グローバル変数 ---
        // クイズの状態を管理する変数（中身が変わるデータ）
        let currentQuestionIndex = 0; // 現在、第何問目か (0からスタート)
        let score = 0;                // 現在の正解数
        let quizActive = false;       // クイズが回答可能状態か (true=はい, false=いいえ)
        let shuffledQuizData = [];    // 出題順をシャッフルしたクイズデータを入れる配列
        let selectedQuizData = [];    // 選択された難易度のクイズデータを入れる配列
        let currentLevel = '1';       // 現在選択されている難易度レベル
		let startTime = 0;            // タイム計測開始時間 

        // --- 3. DOM要素の取得 ---
        // HTMLの各部品（ボタンや画面など）をJavaScriptで操作できるように、変数に入れます。
        const homeButton = document.getElementById('home-button');

        const quizScreen = document.getElementById('quiz-screen');

        const nextButton = document.getElementById('next-button');

        const choicesArea = document.getElementById('choices-area');
        const feedbackArea = document.getElementById('feedback-area');
        const answerArea = document.getElementById('answer-area');
        const expArea = document.getElementById('exp-area');
        const resultTitle = document.getElementById('result-title');
        const finalScoreText = document.getElementById('final-score-text');
        const mainTitle = document.querySelector('#quiz-container h1');
        const startScreenTitle = document.getElementById('start-screen').querySelector('h2');
		const showRankingButton = document.getElementById('show-ranking-button');
		const rankingDisplayArea = document.getElementById('ranking-display-area');
		const shareButton = document.getElementById('share-button');
		


        // --- 4. 関数定義 ---
        // function 関数名() { ... }: 処理をひとまとめにした「関数」を定義します。

        /**
         * @function selectDifficulty
         * @description 難易度ボタンが押された時の処理
         * @param {string} level - 選択された難易度レベル (例: '1')
         */
        function selectDifficulty(level) {
            // 1. 選ばれたレベルを保存
            currentLevel = level;
            // 2. そのレベルの問題データを allQuizData から取り出す
            selectedQuizData = allQuizData[currentLevel];

            // 3. タイトルやスコア表示を更新
            mainTitle.textContent = `レベル${currentLevel}`;
            const totalQuestions = selectedQuizData.length;
            startScreenTitle.textContent = `全${totalQuestions}問！宇宙の知識を試そう！`;
            scoreDisplay.textContent = ` 0 / ${totalQuestions}`;

            // 4. 画面を切り替え（難易度選択 → スタート画面）
            difficultySelectScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            homeButton.classList.remove('hidden');
            
			// 5. もしランキングが開いていたら、閉じる
            const isRankingVisible = !rankingDisplayArea.classList.contains('hidden');
            if (isRankingVisible) {
                closeRankingDisplay();
            }
        }

        /**
         * @function handleHomeClick
         * @description HOMEボタンが押された時の処理
         */
        function handleHomeClick() {
            // クイズ（問題画面 or 解説画面）が進行中かチェック
            const isQuizInProgress = !quizScreen.classList.contains('hidden') || !expScreen.classList.contains('hidden');

            // もしクイズ進行中なら、確認ダイアログを出す
            if (isQuizInProgress) {
                if (confirm("クイズの進行度は失われます。それでもホームに戻りますか？")) {
                    returnToHome(); // 「OK」ならHOMEに戻る
                }
            } else {
                // クイズ中でなければ（スタート画面や結果画面）、確認なしでHOMEに戻る
                returnToHome();
            }
        }

        /**
         * @function returnToHome
         * @description 状態をすべてリセットし、最初の難易度選択画面に戻る
         */
        function returnToHome() {
            // 1. すべての画面を非表示にする
            startScreen.classList.add('hidden');
            quizScreen.classList.add('hidden');
            expScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');

            // 2. 難易度選択画面を表示する
            difficultySelectScreen.classList.remove('hidden');

            // 3. HOMEボタン自体を非表示にする
            homeButton.classList.add('hidden');

            // 4. タイトルやスコア表示を初期状態に戻す
            mainTitle.textContent = "天文クイズ";
            scoreDisplay.textContent = " 0 / 0";

            // 5. ランキング表示も閉じる
			closeRankingDisplay();
            
            // 6. クイズの状態管理変数をリセット
            currentQuestionIndex = 0;
            score = 0;
            quizActive = false;
            shuffledQuizData = [];
            selectedQuizData = [];
            currentLevel = '1';
        }


        /**
         * @function shuffleArray
         * @description 配列の中身をランダムに入れ替える（シャッフル）
         * @param {array} array - シャッフルしたい配列
         * @returns {array} - シャッフルされた新しい配列
         */
        function shuffleArray(array) {
            let newArray = array.slice(); // 元の配列をコピーして新しい配列を作る
            // 配列の後ろから順番に、ランダムに選んだ要素と入れ替えていく
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]]; 
            }
            return newArray; // シャッフル後の配列を返す
        }

        /**
         * @function startGame
         * @description クイズスタートボタンが押された時の処理
         */
        function startGame() {
            // 1. 問題をシャッフル
            shuffledQuizData = shuffleArray(selectedQuizData);
            // 2. 変数をリセット
            currentQuestionIndex = 0;
            score = 0;
            quizActive = true;
            // 3. タイム計測開始
			startTime = Date.now();
            // 4. 画面切り替え（スタート画面 → クイズ画面）
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            expScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            
            // 5. 最初の問題を表示
            updateScoreDisplay();
            displayQuestion();
        }

        /**
         * @function updateScoreDisplay
         * @description 現在のスコアを画面上部のスコア表示エリアに反映する
         */
        function updateScoreDisplay() {
            scoreDisplay.textContent = ` ${score} / ${shuffledQuizData.length}`;
        }

        /**
         * @function displayQuestion
         * @description 問題文と選択肢を画面に表示する
         */
        function displayQuestion() {
            // 解説画面を隠し、クイズ画面を表示
            expScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            // もし全問解き終わったら、結果画面へ
            if (currentQuestionIndex >= shuffledQuizData.length) {
                endGame();
                return;
            }

            // 表示する現在のクイズデータを取得
            const currentQuiz = shuffledQuizData[currentQuestionIndex];
            
            // 問題番号と問題文を画面にセット
            questionNumber.textContent = `問題 ${currentQuestionIndex + 1} / ${shuffledQuizData.length}`;
            questionArea.textContent = currentQuiz.question;
            
            // 選択肢エリア(choicesArea)の中身を一旦空にする
            choicesArea.innerHTML = ''; 

            // 選択肢の配列をループして、ボタンを1つずつ作成
            currentQuiz.choices.forEach(choice => {
                const button = document.createElement('button');
                button.textContent = choice;
                // Tailwind CSSのクラス（デザイン）を設定
                button.classList.add(
                    'choice-button', 'p-4', 'bg-gray-800', 'text-gray-100', 'font-semibold',
                    'rounded-lg', 'text-left', 'shadow-md', 'transition', 'duration-200'
                );
                // ボタンがクリックされたら checkAnswer 関数を呼ぶ
                button.addEventListener('click', () => checkAnswer(choice, button));
                // 画面にボタンを追加
                choicesArea.appendChild(button);
            });
            
            quizActive = true; // 回答可能な状態にする
            feedbackArea.textContent = ''; // 正解/不正解の表示を空にする
        }

        /**
         * @function checkAnswer
         * @description 選択肢がクリックされた時の処理
         * @param {string} selectedChoice - ユーザーが選んだ選択肢の文字列
         * @param {HTMLElement} selectedButton - ユーザーが押したボタン要素
         */
        function checkAnswer(selectedChoice, selectedButton) {
            // 連打防止（回答不可状態なら何もしない）
            if (!quizActive) return;
            quizActive = false; // 回答不可状態にする

            const currentQuiz = shuffledQuizData[currentQuestionIndex];
            // 正解(answer)と選んだ選択肢(selectedChoice)を比較
            const isCorrect = selectedChoice === currentQuiz.answer;

            // 全てのボタンを押せないようにし、色を変更
            Array.from(choicesArea.children).forEach(button => {
                button.disabled = true;
                if (button.textContent === currentQuiz.answer) {
                    // 正解のボタンを緑にする
                    button.classList.add('bg-green-600', 'ring-4', 'ring-green-400');
                    button.classList.remove('bg-gray-800');
                } else if (button === selectedButton && !isCorrect) {
                    // 間違って押したボタンを赤にする
                    button.classList.add('bg-red-600', 'ring-4', 'ring-red-400');
                    button.classList.remove('bg-gray-800');
                }
            });

            if (isCorrect) {
                // 正解だった場合
                score++;
                feedbackArea.textContent = '✅ 正解！！';
                feedbackArea.classList.remove('text-red-500');
                feedbackArea.classList.add('text-green-500');
            } else {
                // 不正解だった場合
                feedbackArea.textContent = '❌ 不正解...';
                feedbackArea.classList.remove('text-green-500');
                feedbackArea.classList.add('text-red-500');
            }
            
            updateScoreDisplay(); // スコア表示を更新
            
            // 2秒後（2000ミリ秒後）に解説画面へ
            setTimeout(showExplanation, 2000);
        }

        /**
         * @function showExplanation
         * @description 解説画面を表示する
         */
        function showExplanation(){
            const currentQuiz = shuffledQuizData[currentQuestionIndex];
            
            // 正解の答えを画面にセット
            answerArea.textContent = currentQuiz.answer;
            // allQuizData から解説文(exp)を取り出す
            // もし解説文が空(null や "")なら、「解説は準備中です。」と表示
            expArea.textContent = currentQuiz.exp || '解説は準備中です。'; 
            
            // 画面切り替え（クイズ画面 → 解説画面）
            quizScreen.classList.add('hidden');
            expScreen.classList.remove('hidden');
        }

        /**
         * @function nextQuestion
         * @description 「次へ進む」ボタンが押された時の処理
         */
        function nextQuestion() {
            expScreen.classList.add('hidden');
            currentQuestionIndex++; // 問題番号を1増やす
            displayQuestion(); // 次の問題を表示
        }

        /**
         * @function endGame
         * @description 全問終了時の処理（結果表示とスコア送信）
         */
        function endGame() {
            // 画面切り替え（クイズ画面 → 結果画面）
            quizScreen.classList.add('hidden');
            expScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
			// 1. タイム計測終了＆秒に変換
            const endTime = Date.now();
			const clearTime = (endTime - startTime) / 1000;
            // 2. タイムを「X分Y秒」の形式に変換
			const formattedTime = formatTime(clearTime);
            const total = shuffledQuizData.length;
            
            // 3. スコアに応じてメッセージを変更
            let titleText = "";
            if (score === total) {
                titleText = "満点！Perafect！";
            } else if (score >= total * 0.7) {
                titleText = "7割越え！すごい！！";
            } else {
                titleText = "再度挑戦！!";
            }
            
            // 4. 結果を画面に表示
            resultTitle.textContent = titleText; 
            finalScoreText.textContent = `${score} / ${total} (${formattedTime})`; 
            scoreDisplay.textContent = `${score} / ${total}`;
			
			// 5.シェアするテキストを生成
            let shareText = "";

            if (score === total) {
                // ★満点の時のテキスト
                shareText = `天文クイズ🚀 (レベル${currentLevel})で
【 👑 全問正解達成！！ 👑 】
クリアタイム: ${formattedTime}

あなたも宇宙博士を目指そう！
６号館4階でプラネタリウムも開催中⭐️

#千葉工大 #天文研究部 #津田沼祭 #第76回津田沼祭 #沼祭天文クイズ`;
            } else {
                // ★それ以外の時のテキスト
                shareText = `天文クイズ🚀 (レベル${currentLevel})
${score} / ${total} 問正解しました！ (クリアタイム: ${formattedTime})

６号館4階でプラネタリウムも開催中⭐️

#千葉工大 #天文研究部 #津田沼祭 #第76回津田沼祭 #沼祭天文クイズ`;
            }
            //  XのシェアURL（Web Intent）を作成
            // encodeURIComponent() は、テキストやURLをツイートで安全に使えるように変換します
            const twitterIntentUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}`;

            // HTMLの <a id="share-button"> の href 属性を設定
            shareButton.href = twitterIntentUrl;

            // --- 6. ランキング送信処理 ---
            // 0.5秒待ってから、名前入力とスコア送信処理を開始
            setTimeout(() => {
                const userName = prompt("ランキングに登録する名前を入力してください（キャンセル可）", "名無しの宇宙博士");
                
                // ユーザーが名前を入力した場合 (キャンセルや空欄でない場合)
                if (userName) {
                    // 送信するデータを作成
                    const postData = {
                        name: userName,
                        score: score,
                        level: currentLevel, // 現在のレベル
                        time: clearTime      // クリアタイム(秒)
                    };

                    alert("スコアを送信しています...");

                    // fetch APIを使ってGASにデータを送信(POST)
                    fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'cors',
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8',
                        },
                        body: JSON.stringify(postData)
                    })
                    .then(response => response.json()) // GASからの返事をJSONとして受け取る
                    .then(data => {
                        // 送信成功
                        if (data.status === 'success') {
                            alert(`${userName}さん (レベル${data.level}) のスコア「${data.score}点 / ${formattedTime}」を登録しました！`);
                        } else {
                            throw new Error(data.message);
                        }
                    })
                    .catch(error => {
                        // 送信失敗
                        console.error('スコア送信エラー:', error);
                        alert('スコアの登録に失敗しました。\n' + error.message);
                    });
                }
            }, 500); 
        }

        /**
         * @function formatTime
         * @description 秒数を「X分Y秒」の文字列に変換する
         * @param {number} totalFloatSeconds - 合計秒数 (例: 125.23)
         * @returns {string} - フォーマットされた時間 (例: "2分5秒")
         */
		function formatTime(totalFloatSeconds) {
            const totalIntSeconds = Math.floor(totalFloatSeconds);
            const minutes = Math.floor(totalIntSeconds / 60); // 分を計算
            const seconds = totalIntSeconds % 60; // 残りの秒を計算

            if (minutes > 0) {
                return `${minutes}分${seconds}秒`; // 1分以上の場合
            } else {
                return `${seconds}秒`; // 1分未満の場合
            }
        }

        /**
         * @function fetchAndDisplayRanking
         * @description 指定されたレベルのランキングをGASから取得(GET)して表示する
         * @param {string} level - 取得したいレベル ('1', '2', ...)
         */
        function fetchAndDisplayRanking(level) {
            const levelSelectArea = document.getElementById('ranking-level-select');
            const resultDisplayArea = document.getElementById('ranking-result-display');

            // 1. ローディング表示
            resultDisplayArea.innerHTML = `<p class="text-center">レベル ${level} のランキングを読み込み中...</p>`;
            
            // 2. 画面切り替え（レベル選択 → 結果表示）
            levelSelectArea.classList.add('hidden');
            resultDisplayArea.classList.remove('hidden');

            // 3. fetch APIを使ってGASからデータを取得(GET)
            // (GASのURLに ?level=1 のようにパラメータを付けて送る)
            fetch(GAS_WEB_APP_URL + "?level=" + level) 
                .then(response => response.json()) // データをJSONとして受け取る
                .then(data => {
                    // 4. 取得成功
                    if (data.status === 'error') {
                        throw new Error(data.message);
                    }
                    
                    // 5. 表示するHTMLを組み立てる
                    let html = `<h3 class="text-xl font-bold text-yellow-400 text-center mb-3">🏆 レベル ${level} TOP 10 🏆</h3>`;
                    
                    if (data.length === 0) {
                        // データが0件の場合
                        html += '<p class="text-center">まだランキングデータがありません。</p>';
                    } else {
                        // データがある場合
                        html += '<ol class="list-decimal list-inside space-y-2">';
                        data.forEach((item, index) => {
                            let medal = '';
                            if(index === 0) medal = '🥇';
                            if(index === 1) medal = '🥈';
                            if(index === 2) medal = '🥉';
                            
                            const formattedTime = formatTime(item.time);
                            html += `<li>${medal} <strong>${item.name}</strong>: ${item.score}点 (${formattedTime})</li>`;
                        });
                        html += '</ol>';
                    }
                    
                    // 「レベル選択に戻る」ボタンを追加
                    html += '<button onclick="showLevelSelect()" class="mt-4 w-full p-2 bg-gray-600 hover:bg-gray-700 rounded">レベル選択に戻る</button>';
                    
                    // 組み立てたHTMLを画面に挿入
                    resultDisplayArea.innerHTML = html;
                })
                .catch(error => {
                    // 6. 取得失敗
                    console.error('ランキング取得エラー:', error);
                    resultDisplayArea.innerHTML = `<p class="text-center text-red-500">ランキングの取得に失敗しました。</p><button onclick="showLevelSelect()" class="mt-4 w-full p-2 bg-gray-600 hover:bg-gray-700 rounded">レベル選択に戻る</button>`;
                });
        }

        /**
         * @function closeRankingDisplay
         * @description ランキング表示エリアを閉じる
         */
		function closeRankingDisplay() {
            rankingDisplayArea.classList.add('hidden');
            // ボタンのテキストを「見る」に戻す
            showRankingButton.innerHTML = '🏆 ランキングを見る';
        }
        
        /**
         * @function showLevelSelect
         * @description ランキング結果から「レベル選択に戻る」時の処理
         */
		function showLevelSelect() {
            // 結果表示を隠し、レベル選択を表示
            document.getElementById('ranking-result-display').classList.add('hidden');
            document.getElementById('ranking-level-select').classList.remove('hidden');
        }

        // --- 5. イベントリスナーの登録 ---
        // 各ボタンに、クリックされたらどの関数を実行するかを割り当てる
        homeButton.addEventListener('click', handleHomeClick); 
        startButton.addEventListener('click', startGame);
        nextButton.addEventListener('click', nextQuestion); 
        showRankingButton.addEventListener('click', displayRanking);
        
        // ▲▲▲ JavaScriptの処理終了 ▲▲▲
    </script>
</body>
</html>
