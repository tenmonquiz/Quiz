        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyzvBFBRYLyrZzfdsGcWoaU7hXIUggbPUqGcX9zK4qL6Cg9F6kbtKKvplekCwMtOpH4/exec";

        // --- 1. クイズデータ ---
        const allQuizData = {
            "1": [
                { question: "月は地球の周りを回りながら自転しています。月は約何日で1回自転をするでしょう？", choices: ["約1日", "約27日", "約60日", "約243日"], answer: "約27日", exp:"月の自転周期は27.3日で、約1カ月かけて自転しています。公転周期も同じく27.3日のため、地球からは月の裏側を観測することはできません。" },
				
                { question: "日本の一年のうち、一番昼が短い日は、次のうちどれでしょう？", choices: ["春分の日", "夏至", "秋分の日", "冬至"], answer: "冬至", exp:"今年の冬至は12月22日です。" },
				
                { question: "国際天文学連合によると、現在星座は何個あるとされているでしょう？", choices: ["44個", "66個", "88個", "102個"], answer: "88個", exp:"1922年、国際天文学連合によって88個と決められました。" },
				
                { question: "自ら光を発している星をなんというでしょう？", choices: ["恒星", "惑星", "光星", "彗星"], answer: "恒星", exp:"恒星は自ら光を発する天体で、太陽もその一つです。" },
				
                { question: "太陽系の惑星の中で最も大きいものはどれでしょう？", choices: ["地球", "火星", "木星", "土星"], answer: "木星", exp:"木星の直径は地球の約11倍です。" },
				
                { question: "現在の北極星は次のうちどれでしょう？", choices: ["ベガ", "ポラリス", "エライ", "デネブ"], answer: "ポラリス", exp:"現在の北極星はこぐま座のポラリスです。" },
				
                { question: "次のうち黄道12星座に含まれていないものはどれでしょう？", choices: ["おうし座", "おおぐま座", "おひつじ座", "やぎ座"], answer: "おおぐま座", exp:"おおぐま座は北にある星座で一年中見ることができます。" },
				
                { question: "惑星の周りをまわる星をなんと呼ぶでしょう？", choices: ["恒星", "小惑星", "衛星", "周惑星"], answer: "衛星", exp:"地球では月が該当します。" },
				
                { question: "主成分が氷と塵であり、別名ほうき星と呼ばれる星は何でしょう？", choices: ["衛星", "氷星", "塵星", "彗星"], answer: "彗星", exp:"彗星は氷と塵でできており、太陽に近づくと尾を作るため「ほうき星」とも呼ばれます。" },
				
                { question: "冬の大三角を構成する星はオリオン座のベテルギウス、おおいぬ座のシリウスとこいぬ座のなんでしょう？", choices: ["ベガ", "アルタイル", "プロキオン", "アルデバラン"], answer: "プロキオン", exp:"ベテルギウス、シリウス、プロキオン共に1等星で津田沼でもすぐに見つけることができます。" }
				
            ],
            "2": [
                { question: "太陽と地球の距離は何kmでしょう？", choices: ["約100万km", "約5000万km", "約1億5000万km", "約5億km"], answer: "約1億5000万km", exp:"太陽と地球の平均距離を1天文単位 = 1auで表します。" },
				
                { question: "火星を表す惑星記号はどれでしょう？", choices: ["♀", "♂", "♄", "♃"], answer: "♂", exp:"♀が金星、♄が土星、♃が木星です。" },
				
                { question: "太陽の表面温度は約何度でしょう？", choices: ["約6000℃", "約10000℃", "約12000℃", "約16000℃"], answer: "約6000℃", exp:"太陽の表面温度は約6000℃で、中心部は約1600万℃とされています。" },
				
                { question: "最近、ミクロの研究が盛んなことでよく聞く「μ」や「n」ですが、10の-6乗を表すのはどれでしょう？", choices: ["μ（マイクロ）", "n（ナノ）", "Å（オングストローム）", "m（ミリ）"], answer: "μ（マイクロ）", exp:"nが-9乗、Åが-10乗、mが-3乗です。" },
				
                { question: "有名な源平合戦ですが、ある天文的な現象が勝敗を分けた戦いがあると言われています。その現象とは何でしょう？", choices: ["月食", "日食", "新月", "太陽フレア"], answer: "日食", exp:"平氏側だけが日食の情報を知っており、源氏側が動揺しているうちに平氏側が勝利したと伝えられています。" },
				
                { question: "太陽系の惑星の中で衛星を持たないものはどれでしょう？", choices: ["木星", "金星", "地球", "火星"], answer: "金星", exp:"太陽系の中で衛星を持たないのは水星と金星です。" },
				
                { question: "現在、世界の多くの国々で採用されている太陽暦は何でしょう？", choices: ["ハアブ暦", "グレゴリオ暦", "ユリウス暦", "ツォルキン暦"], answer: "グレゴリオ暦", exp:"グレゴリオ暦は1582年10月、ローマ教皇のグレゴリオ13世によって施行されました。" },
				
                { question: "国際宇宙ステーション（ISS）に設置されている日本の実験棟は何でしょう？", choices: ["きぼう", "のぞみ", "あかつき", "こうのとり"], answer: "きぼう", exp:"「のぞみ」は火星探査機、「あかつき」は金星探査機、「こうのとり」は宇宙ステーション補給機です。" },
				
                { question: "北極星を見つける際に用いられる北斗七星とカシオペヤ座ですが、いずれも基準となる線を何倍すると北極星に辿り着けるでしょう？", choices: ["2倍", "3倍", "5倍", "8倍"], answer: "5倍", exp:"北斗七星の柄の端やカシオペヤ座のW字の頂点を結ぶ線を5倍延長すると、ほぼ天の北極にある北極星にたどり着きます。" },
				
                { question: "天球上における太陽の通り道をなんと呼ぶでしょう？", choices: ["赤道", "金道", "白道", "黄道"], answer: "黄道", exp:"黄道は、地球から見た太陽の通り道で、黄道十二星座の基準にもなります。" }
            ],
            "3": [
                { question: "地球で体重30kgの人が月面で体重計に乗ると何kgになるでしょう？", choices: ["5kg", "10kg", "30kg", "180kg"], answer: "5kg", exp:"月の重力は地球の約1/6なので、地球で30kgの人は月では5kgになります。" },
				
                { question: "地球は月の何倍の大きさ（直径）を持つでしょう？", choices: ["2倍", "4倍", "6倍", "8倍"], answer: "4倍", exp:"月の直径は地球の約1/4、質量は地球の約1/81です。" },
				
                { question: "最近話題となったレモン彗星は、何から名付けられたでしょう？", choices: ["発見者", "観測地", "色", "形"], answer: "観測地", exp:"レモン山天文台で観測されたことからレモン彗星と名付けられました。" },
				
                { question: "88星座の中で、1つの星座が2つの領域に分けられているものはどれでしょう？", choices: ["うお座", "てんびん座", "へび座", "しし座"], answer: "へび座", exp:"へびつかい座を挟み頭部と尾部に分かれています。" },
				
                { question: "三大流星群とはしぶんぎ座流星群、ペルセウス流星群となんでしょう？", choices: ["オリオン流星群", "おうし座流星群", "しし座流星群", "ふたご座流星群"], answer: "ふたご座流星群", exp:"1月のしぶんぎ座流星群、8月のペルセウス座流星群、12月のふたご座流星群は毎年安定して多くの流星が流れることから三大流星群と呼ばれます。" },
				
                { question: "太陽の表面には「黒点」というものがありますが、その特徴として、当てはまらないものはどれでしょう？", choices: ["表面温度が周りより低い", "磁場が周りより強い", "場所が変わる", "直径約500km"], answer: "直径約500km", exp:"黒点の大きさは数千ｋｍから数万ｋｍとされています。" },
				
                { question: "1等星は2等星の何倍の明るさをもつでしょう？", choices: ["約2倍", "約2.5倍", "約5倍", "約10倍"], answer: "約2.5倍", exp:"1等星から6等星は約100倍の差があります" },
				
                { question: "太陽風とは何でしょう？", choices: ["風", "プラズマ", "光", "圧力"], answer: "プラズマ", exp:"太陽風とは、太陽から吹き出している電気を帯びた粒子（プラズマ）の流れです。" },
				
                { question: "次のうち、星座に描かれていない動物はなんでしょう？", choices: ["うし", "とら", "うさぎ", "へび"], answer: "とら", exp:"88星座にはおうし座・うさぎ座・へび座などがありますが、とらは星座にされていません。" },
				
                { question: "天の北極があるのはこぐま座ですが、天の南極があるのは何座でしょう？", choices: ["しぶんぎ座", "ろくぶんぎ座", "はちぶんぎ座", "じゅうぶんぎ座"], answer: "はちぶんぎ座", exp:"ろくぶんぎ座は存在しますがじゅうぶんぎ座は実在しません。しぶんぎ座は過去に存在した星座で、現在はしぶんぎ座流星群にその名を残しています。" }
            ],
            "4": [
                { question: "古代ギリシャ語で木星のことをなんと呼ぶでしょう？", choices: ["ゼウス", "ジュピター", "ビーナス", "アレス"], answer: "ゼウス", exp:"ジュピターはローマ神話における木星、ビーナスはローマ神話における金星、アレスはギリシャ神話における火星に相当する。" },
				
                { question: "新潟を本拠地とするサッカーチーム・野球チームの名称の由来にもなっている、橙色と青色のコントラストが美しいはくちょう座の二重星はなんでしょう？", choices: ["デネブ", "アルビレオ", "アルコル", "デネボラ"], answer: "アルビレオ", exp:"黄色に輝く星がアルビレオA、青色に輝く星がアルビレオBと呼ばれる" },
				
                { question: "国旗に描かれている星にはそれぞれ一つの州が当てられている国はどこでしょう？", choices: ["メキシコ", "中国", "ベトナム", "ブラジル"], answer: "ブラジル", exp:"ブラジル国旗の星は、27個の星で、それぞれの星がブラジル連邦を構成する26州と1つの連邦直轄区を表している" },
				
                { question: "かつて最も大きな星座であったアルゴ船座は4つに分割されましたが、その4つの星座に含まれないのは次のうちどれでしょう？", choices: ["らしんばん座", "ポンプ座", "ほ座", "りゅうこつ座"], answer: "ポンプ座", exp:"古くから存在する星座であったが、大きすぎたため国際天文学連合がりゅうこつ座、とも座、ほ座、らしんばん座の4つに分割した" },
				
                { question: "次のうち、距離が最も長いものはどれか。", choices: ["10億km", "1パーセク", "1光年", "1天文単位"], answer: "1パーセク", exp:"１天文単位がおよそ１億5000万kmであり、１光年は63000天文単位、１パーセクは3.26光年である" },

                { question: "天文単位(au)について、間違った説明文はどれでしょう？", choices: ["太陽-冥王星間は約5auと表される", "地球-太陽間の平均距離に由来する単位である", "1auを約1億5000kmとする距離の単位である", "auとは、astronomical unitの略称である"], answer: "太陽-冥王星間は約5auと表される", exp:"太陽-冥王星間は約40auである。5auは太陽と木星の距離に相当する" },

            "5": [
                { question: "太陽系の惑星の中で公転周期の離心率が最も大きいのはどれでしょう？", choices: ["水星", "金星", "海王星", "火星"], answer: "水星", exp:"離心率とは曲線の特徴を表す数値であり、0ならば完全な円　0以上１以下ならば楕円を表す。それぞれの離心率は水星が0.205,金星は0.0068、海王星が0.009、火星は0.093である。" },
				
                { question: "歳差運動によって北極星は移り変わっていきます。次のうち、北極星の役割とならない星はどれでしょう？", choices: ["ベガ", "デネブ", "ポラリス", "アルデバラン"], answer: "アルデバラン", exp:"ポラリスが現在の北極星であり、約8300年後にデネブ、約12000年後にベガが北極星になる。" },
				
                { question: "ニコラウス・コペルニクスについての間違った説明文はどれでしょう？", choices: ["ポーランド出身である", "「天球の回転について」の著者であり、地動説を唱えた", "天動説を否定したため、カトリック教会の宗教裁判にかけられた", "ヨーロッパルネサンス時代の天文学者である"], answer: "天動説を否定したため、カトリック教会の宗教裁判にかけられた", exp:"コペルニクスは地動説を唱えたが、宗教裁判にはかけられていない。" },
				
                { question: "世界で初めて月に軟着陸をした月探査機はどれでしょう？", choices: ["ルナ2号", "ルナ9号", "アポロ8号", "アポロ9号"], answer: "ルナ9号", exp:"ルナ２号は月面に衝突、アポロ8号は月面の裏を確認、アポロ9号は史上初のドッキングを行った。" },
				
                { question: "世界で初めて有人での月面着陸に成功した月探査機はどれでしょう？", choices: ["ルナ9号", "かぐや", "アポロ8号", "アポロ11号"], answer: "アポロ11号", exp:"ルナ9号は無人での月面着陸である。かぐやは2007年に打ち上げられた比較的新しい探査機である。アポロ8号は月面を周回した。" },
				
                { question: "各国の月探査機の名前で、月が由来になっていないものはどれでしょう？", choices: ["中国の嫦娥", "ロシアのルナ", "インドのチャンドラヤーン", "アメリカのアポロ"], answer: "アメリカのアポロ", exp:"嫦娥(じょうが)は中国神話の月神に由来する。ルナはローマ神話の月の神である。チャンドラヤーンはサンスクリット語で月の乗り物という意味である。" },
				
                { question: "次のうち、最も公転周期の短い彗星はどれでしょう？", choices: ["ヘール・ボップ彗星", "エンケ彗星", "レモン彗星", "スワン彗星"], answer: "エンケ彗星", exp:"それぞれの公転周期は、ヘール・ボップ彗星が4200年、エンケ彗星は3.3年、レモン彗星が1350年、スワン彗星は20,000年以上と推定されている。" },
				
                { question: "現在、星空保護区に認定されていない場所はどこでしょう？", choices: ["神津島(東京)", "南六呂師(福井)", "西表石垣国立公園(沖縄)", "阿智村(長野)"], answer: "阿智村(長野)", exp:"2025年時点で、西表石垣国立公園　神津島　井原市美星町　大野市南六呂師エリアの4つが星空保護区に指定されている。" },
				
                { question: "恒星の最後の姿として有名な「超新星爆発残骸」ですが、「超新星爆発」を起こすか起こさないかの境目になるのは太陽質量(太陽の質量を1としたとき)の何倍でしょう？", choices: ["4倍", "8倍", "16倍", "32倍"], answer: "8倍", exp:"重力崩壊型超新星爆発を起こすのに必要な質量は6-10倍だとされている。" },
				
                { question: "最初に国産の反射望遠鏡を作ったのは誰でしょう？", choices: ["岩橋善兵衛", "森仁左衛門", "伊能忠敬", "国友藤兵衛"], answer: "国友藤兵衛", exp:"国友藤兵衛は他にも実用空気銃を作成しており江戸時代のエジソンとも呼ばれる" }
            ]
        };

        // --- 2. グローバル変数 ---
        let currentQuestionIndex = 0;
        let score = 0;
        let quizActive = false;
        let shuffledQuizData = [];
        let selectedQuizData = [];
        let currentLevel = '1';
        let startTime = 0;

        // --- 3. DOM要素の取得 ---
        const dom = {
            homeButton: document.getElementById('home-button'),
            difficultyScreen: document.getElementById('difficulty-select-screen'),
            startScreen: document.getElementById('start-screen'),
            quizScreen: document.getElementById('quiz-screen'),
            expScreen: document.getElementById('exp-screen'),
            resultScreen: document.getElementById('result-screen'),
            
            startButton: document.getElementById('start-button'),
            nextButton: document.getElementById('next-button'),
            showRankingBtn: document.getElementById('show-ranking-button'),
            closeRankingBtn: document.getElementById('close-ranking-btn'),
            
            scoreDisplay: document.getElementById('score-display'),
            questionNumber: document.getElementById('question-number'),
            questionArea: document.getElementById('question-area'),
            choicesArea: document.getElementById('choices-area'),
            feedbackArea: document.getElementById('feedback-area'),
            
            answerArea: document.getElementById('answer-area'),
            expArea: document.getElementById('exp-area'),
            
            resultTitle: document.getElementById('result-title'),
            finalScoreText: document.getElementById('final-score-text'),
            shareButton: document.getElementById('share-button'),
            
            mainTitle: document.querySelector('#quiz-container h1'),
            startScreenTitle: document.getElementById('start-screen').querySelector('h2'),
            
            rankingDisplayArea: document.getElementById('ranking-display-area'),
            rankingLevelSelect: document.getElementById('ranking-level-select'),
            rankingResultDisplay: document.getElementById('ranking-result-display')
        };

        // --- 4. 初期化 & イベントリスナー設定 ---
        function initEventListeners() {
            // 難易度選択ボタン (修正: クラス名を difficulty-button に統一)
            document.querySelectorAll('.difficulty-button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const level = e.target.dataset.level;
                    selectDifficulty(level);
                });
            });

            // ランキングのレベル選択ボタン
            document.querySelectorAll('.rank-level-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const level = e.target.dataset.rankLevel;
                    fetchAndDisplayRanking(level);
                });
            });

            dom.homeButton.addEventListener('click', handleHomeClick);
            dom.startButton.addEventListener('click', startGame);
            dom.nextButton.addEventListener('click', nextQuestion);
            dom.showRankingBtn.addEventListener('click', toggleRankingDisplay);
            dom.closeRankingBtn.addEventListener('click', closeRankingDisplay);
        }

        // --- 5. 画面遷移関数 ---
        function showScreen(screenElement) {
            document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
            screenElement.classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        // --- 6. ゲームロジック ---
        function selectDifficulty(level) {
            currentLevel = level;
            selectedQuizData = allQuizData[currentLevel];
            
            dom.mainTitle.textContent = `レベル${currentLevel}`;
            const totalQuestions = selectedQuizData.length;
            dom.startScreenTitle.textContent = `全${totalQuestions}問！宇宙の知識を試そう！`;
            dom.scoreDisplay.textContent = `0 / ${totalQuestions}`;

            if (!dom.rankingDisplayArea.classList.contains('hidden')) {
                closeRankingDisplay();
            }

            dom.homeButton.classList.remove('hidden');
            showScreen(dom.startScreen);
        }

        function handleHomeClick() {
            const isQuizInProgress = !dom.quizScreen.classList.contains('hidden') || !dom.expScreen.classList.contains('hidden');
            if (isQuizInProgress) {
                if (confirm("クイズの進行度は失われます。それでもホームに戻りますか？")) {
                    returnToHome();
                }
            } else {
                returnToHome();
            }
        }

        function returnToHome() {
            dom.homeButton.classList.add('hidden');
            dom.mainTitle.textContent = "天文クイズ";
            dom.scoreDisplay.textContent = "0 / 0";
            
            closeRankingDisplay();
            showScreen(dom.difficultyScreen);

            currentQuestionIndex = 0;
            score = 0;
            quizActive = false;
            shuffledQuizData = [];
        }

        function shuffleArray(array) {
            let newArray = array.slice();
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function startGame() {
            shuffledQuizData = shuffleArray(selectedQuizData);
            currentQuestionIndex = 0;
            score = 0;
            quizActive = true;
            startTime = Date.now();
            
            updateScoreDisplay();
            displayQuestion();
            showScreen(dom.quizScreen);
        }

        function updateScoreDisplay() {
            dom.scoreDisplay.textContent = `${score} / ${shuffledQuizData.length}`;
        }

        function displayQuestion() {
            if (currentQuestionIndex >= shuffledQuizData.length) {
                endGame();
                return;
            }
            
            dom.expScreen.classList.add('hidden');
            dom.quizScreen.classList.remove('hidden');

            const currentQuiz = shuffledQuizData[currentQuestionIndex];
            dom.questionNumber.textContent = `問題 ${currentQuestionIndex + 1} / ${shuffledQuizData.length}`;
            dom.questionArea.textContent = currentQuiz.question;
            
            dom.choicesArea.innerHTML = ''; 
            
            const shuffledChoices = shuffleArray(currentQuiz.choices);
            shuffledChoices.forEach(choice => {
                const button = document.createElement('button');
                button.textContent = choice;
                button.className = 'choice-button w-full p-4 rounded-lg text-left shadow-md transition duration-200 text-base md:text-lg active:translate-y-1 bg-gray-800 text-gray-100';
                
                button.addEventListener('click', () => checkAnswer(choice, button));
                dom.choicesArea.appendChild(button);
            });
            
            quizActive = true;
            dom.feedbackArea.textContent = '';
        }

        function checkAnswer(selectedChoice, selectedButton) {
            if (!quizActive) return;
            quizActive = false;

            const currentQuiz = shuffledQuizData[currentQuestionIndex];
            const isCorrect = selectedChoice === currentQuiz.answer;

            Array.from(dom.choicesArea.children).forEach(button => {
                button.disabled = true;
                if (button.textContent === currentQuiz.answer) {
                    button.classList.replace('bg-gray-800', 'bg-green-600');
                    button.classList.add('bg-green-600', 'ring-4', 'ring-green-400');
                } else if (button === selectedButton && !isCorrect) {
                    button.classList.replace('bg-gray-800', 'bg-red-600');
                    button.classList.add('bg-red-600', 'ring-4', 'ring-red-400');
                }
            });

            if (isCorrect) {
                score++;
                dom.feedbackArea.textContent = '✅ 正解！！';
                dom.feedbackArea.className = 'mt-4 h-6 text-center text-lg font-bold text-green-500';
            } else {
                dom.feedbackArea.textContent = '❌ 不正解...';
                dom.feedbackArea.className = 'mt-4 h-6 text-center text-lg font-bold text-red-500';
            }
            
            updateScoreDisplay();
            setTimeout(showExplanation, 1500); 
        }

        function showExplanation(){
            const currentQuiz = shuffledQuizData[currentQuestionIndex];
            dom.answerArea.textContent = currentQuiz.answer;
            dom.expArea.textContent = currentQuiz.exp || '解説は準備中です。';
            
            dom.quizScreen.classList.add('hidden');
            dom.expScreen.classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            displayQuestion();
        }

        function endGame() {
            const endTime = Date.now();
            const clearTime = (endTime - startTime) / 1000;
            const formattedTime = formatTime(clearTime);
            const total = shuffledQuizData.length;
            
            let titleText = "再度挑戦！!";
            if (score === total) titleText = "満点！Perfect！";
            else if (score >= total * 0.7) titleText = "7割越え！すごい！！";
            
            dom.resultTitle.textContent = titleText; 
            dom.finalScoreText.textContent = `${score} / ${total} (${formattedTime})`; 
            dom.scoreDisplay.textContent = `${score} / ${total}`;
            
            let shareText = "";
            if (score === total) {
                shareText = `天文クイズ🚀 (レベル${currentLevel}) で【 👑 全問正解達成！！ 👑 】\nクリアタイム: ${formattedTime}\n\nあなたも宇宙博士を目指そう！\n６号館4階でプラネタリウムも開催中⭐️\n\n#千葉工大 #天文研究部 #津田沼祭 #第76回津田沼祭 #沼祭天文クイズ`;
            } else {
                shareText = `天文クイズ🚀 (レベル${currentLevel})\n${score} / ${total} 問正解しました！ (クリアタイム: ${formattedTime})\n\n６号館4階でプラネタリウムも開催中⭐️\n\n#千葉工大 #天文研究部 #津田沼祭 #第76回津田沼祭 #沼祭天文クイズ`;
            }
            const twitterIntentUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}`;
            dom.shareButton.href = twitterIntentUrl;

            showScreen(dom.resultScreen);

            setTimeout(() => {
                const userName = prompt("ランキングに登録する名前を入力してください（キャンセル可）", "名無しの宇宙博士");
                if (userName) {
                    sendScoreToGAS(userName, score, currentLevel, clearTime, formattedTime);
                }
            }, 500); 
        }

        // --- 7. ユーティリティ関数 ---
        function formatTime(totalFloatSeconds) {
            const totalIntSeconds = Math.floor(totalFloatSeconds);
            const minutes = Math.floor(totalIntSeconds / 60);
            const seconds = totalIntSeconds % 60;
            return minutes > 0 ? `${minutes}分${seconds}秒` : `${seconds}秒`;
        }

        function sendScoreToGAS(name, score, level, time, formattedTime) {
            alert("スコアを送信しています...");
            
            const postData = { name, score, level, time };
            
            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(postData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(`${name}さん (レベル${level}) のスコア「${score}点 / ${formattedTime}」を登録しました！`);
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(error => {
                console.error('スコア送信エラー:', error);
                alert('スコアの登録に失敗しました。\n' + error.message);
            });
        }

        // --- 8. ランキングUI制御 ---
        function toggleRankingDisplay() {
            if (!dom.rankingDisplayArea.classList.contains('hidden')) {
                closeRankingDisplay();
            } else {
                showLevelSelect();
                dom.rankingDisplayArea.classList.remove('hidden');
                dom.showRankingBtn.textContent = '🏆 ランキングを閉じる';
            }
        }

        function closeRankingDisplay() {
            dom.rankingDisplayArea.classList.add('hidden');
            dom.showRankingBtn.textContent = '🏆 ランキングを見る';
        }

        function showLevelSelect() {
            dom.rankingResultDisplay.classList.add('hidden');
            dom.rankingLevelSelect.classList.remove('hidden');
        }

        function fetchAndDisplayRanking(level) {
            dom.rankingLevelSelect.classList.add('hidden');
            dom.rankingResultDisplay.classList.remove('hidden');
            dom.rankingResultDisplay.innerHTML = `<p class="text-center">レベル ${level} のランキングを読み込み中...</p>`;

            fetch(`${GAS_WEB_APP_URL}?level=${level}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'error') throw new Error(data.message);
                    
                    let html = `<h3 class="text-xl font-bold text-yellow-400 text-center mb-3">🏆 レベル ${level} TOP 10 🏆</h3>`;
                    
                    html += `
                    <div class="text-center mb-4">
                        <button onclick="fetchPerfectRanking('${level}')" class="text-sm bg-yellow-600 hover:bg-yellow-700 text-white px-3 py-1 rounded-full shadow">
                            👑 満点獲得者(Top30)を見る
                        </button>
                    </div>`;

                    if (data.length === 0) {
                        html += '<p class="text-center">データがありません。</p>';
                    } else {
                        html += '<ol class="list-decimal list-inside space-y-2">';
                        data.forEach((item, index) => {
                            const medal = index === 0 ? '🥇' : (index === 1 ? '🥈' : (index === 2 ? '🥉' : ''));
                            html += `<li>${medal} <strong>${item.name}</strong>: ${item.score}点 (${formatTime(item.time)})</li>`;
                        });
                        html += '</ol>';
                    }
                    html += createBackButtons(level, false);
                    dom.rankingResultDisplay.innerHTML = html;
                })
                .catch(err => handleRankingError(err));
        }

        function fetchPerfectRanking(level) {
            dom.rankingResultDisplay.innerHTML = `<p class="text-center">レベル ${level} の<br>👑満点獲得者を検索中...</p>`;
            
            fetch(`${GAS_WEB_APP_URL}?level=${level}&type=perfect`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'error') throw new Error(data.message);
                    
                    let html = `<h3 class="text-xl font-bold text-yellow-400 text-center mb-3">👑 レベル ${level} 満点者 👑</h3>`;
                    if (data.length === 0) {
                        html += '<p class="text-center">まだ満点者はいません。</p>';
                    } else {
                        html += '<ol class="list-decimal list-inside space-y-2">';
                        data.forEach(item => {
                            html += `<li><strong>${item.name}</strong> (${formatTime(item.time)})</li>`;
                        });
                        html += '</ol>';
                    }
                    html += createBackButtons(level, true);
                    dom.rankingResultDisplay.innerHTML = html;
                })
                .catch(err => handleRankingError(err));
        }

        function createBackButtons(level, isPerfectPage) {
            let html = '';
            if (isPerfectPage) {
                html += `<button onclick="fetchAndDisplayRanking('${level}')" class="mt-4 w-full p-2 bg-blue-600 hover:bg-blue-700 rounded">Top10に戻る</button>`;
            }
            html += '<button onclick="showLevelSelect()" class="mt-2 w-full p-2 bg-gray-600 hover:bg-gray-700 rounded">レベル選択に戻る</button>';
            return html;
        }

        function handleRankingError(error) {
            console.error(error);
            dom.rankingResultDisplay.innerHTML = `<p class="text-center text-red-500">取得失敗</p><button onclick="showLevelSelect()" class="mt-4 w-full p-2 bg-gray-600 hover:bg-gray-700 rounded">戻る</button>`;
        }

        // アプリケーション開始
        initEventListeners();
    </script>
</body>
</html>
